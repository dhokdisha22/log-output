apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: broadcaster:latest
          env:
            - name: NATS_URL
              value: "nats://my-nats.nats.svc.cluster.local:4222"
            - name: GENERIC_URL
              value: "http://example.com"