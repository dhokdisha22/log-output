build-publish:
name: Build, Push, Release
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v6

  - name: Login to Docker Hub
    uses: docker/login-action@v4
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build and publish log-writer
    run: |
      docker build --tag "dhokdisha22/log-writer:$GITHUB_SHA" ./log-writer
      docker push "dhokdisha22/log-writer:$GITHUB_SHA"

  - name: Build and publish log-reader
    run: |
      docker build --tag "dhokdisha22/log-reader:$GITHUB_SHA" ./log-reader
      docker push "dhokdisha22/log-reader:$GITHUB_SHA"

  - name: Set up Kustomize
    uses: imranismail/setup-kustomize@v3

  - name: Use right images
    run: |
      kustomize edit set image log-writer=dhokdisha22/log-writer:$GITHUB_SHA
      kustomize edit set image log-reader=dhokdisha22/log-reader:$GITHUB_SHA

  - name: Commit kustomization.yaml
    uses: EndBug/add-and-commit@v10
    with:
      add: 'kustomization.yaml'
      message: New version released ${{ github.sha }}
```
