apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-dep-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
        - name: greeter
          image: greeter:latest
          env:
            - name: GREETING
              value: "Hello from Greeter V1"
          ports:
            - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-1
spec:
  selector:
    app: greeter
    version: v1
  ports:
    - port: 80
      targetPort: 8080

---

